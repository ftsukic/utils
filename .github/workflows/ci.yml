name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate entry
        run: npm run entry

      - name: Run lint
        run: npm run lint

      - name: Generate docs
        run: npm run docs

      - name: Check generated files
        run: git diff --exit-code

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test
